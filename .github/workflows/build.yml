name: Build J2ME iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Verify project and bundled J2ME runtime
        run: |
          test -d J2MEEmulator.xcodeproj
          test -f J2MEEmulator/Resources/jars/j2me_api.jar
          test -f J2MEEmulator/Resources/jars/minijvm_rt.jar
          echo "Xcode project and both bundled runtime JARs found."
          ls -lh J2MEEmulator/Resources/jars/
          xcodebuild -list -project J2MEEmulator.xcodeproj

      # The repository already contains minijvm_rt.jar and j2me_api.jar.
      # Do not call the old shell builders here: their paths still point to
      # miniJVM-2.0.0/ and J2MEEmulator/J2MEEmulator/, which do not exist
      # in this repository layout.
      - name: Build iOS app for iOS 16.4+
        run: |
          set -o pipefail
          xcodebuild \
            -project J2MEEmulator.xcodeproj \
            -scheme J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=16.4 \
            PRODUCT_BUNDLE_IDENTIFIER=com.trantu2641.j2meplayer \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify app and package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JarBox.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: Built .app was not found. Available app bundles:"
            find "$RUNNER_TEMP/DerivedData" -name '*.app' -type d -print || true
            exit 1
          fi

          echo "Built app minimum OS:"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"

          mkdir -p Payload
          ditto "$APP" Payload/J2MEPlayer.app
          /usr/bin/zip -qry J2ME-iOS-unsigned.ipa Payload
          test -s J2ME-iOS-unsigned.ipa
          ls -lh J2ME-iOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-iOS-unsigned
          path: J2ME-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-iOS-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
