name: Build J2ME iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Set up Java for J2ME API build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch and rebuild MiniJVM runtime
        shell: bash
        run: |
          set -euo pipefail

          MINI_JVM_DIR="$RUNNER_TEMP/miniJVM"
          MINI_JVM_COMMIT="76f904ea4008a8058db5155bf5ee2cfe94d19e60"

          git clone \
            --filter=blob:none \
            https://github.com/digitalgust/miniJVM.git \
            "$MINI_JVM_DIR"

          git -C "$MINI_JVM_DIR" checkout --detach "$MINI_JVM_COMMIT"

          PROTOCOL="$MINI_JVM_DIR/minijvm/java/src/main/java/org/mini/net/http/Protocol.java"

          python3 - "$PROTOCOL" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          old = "private static boolean nonPersistentFlag;"
          new = "private static boolean nonPersistentFlag = true;"

          if old not in text:
              raise SystemExit(
                  "PATCH ERROR: nonPersistentFlag not found"
              )

          text = text.replace(old, new, 1)

          old = """conn.openPrim("//" + hostAndPort, Connector.READ_WRITE, true);"""

          new = """conn.openPrim("//" + hostAndPort, Connector.READ_WRITE, true);
          conn.setSocketOption(SocketConnection.TIMEOUT, 10000);"""

          if old not in text:
              raise SystemExit(
                  "PATCH ERROR: direct HTTP connection block not found"
              )

          text = text.replace(old, new, 1)

          old = """conn.openPrim("//" + proxyHost + ":" + proxyPort, Connector.READ_WRITE, true);"""

          new = """conn.openPrim("//" + proxyHost + ":" + proxyPort, Connector.READ_WRITE, true);
          conn.setSocketOption(SocketConnection.TIMEOUT, 10000);"""

          if old not in text:
              raise SystemExit(
                  "PATCH ERROR: proxy HTTP connection block not found"
              )

          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          print("======================================")
          print("MiniJVM HTTP patch applied")
          print("Persistent connection reuse: disabled")
          print("Socket timeout: 10 seconds")
          print("======================================")
          PY

          echo "Building MiniJVM..."

          mvn -q \
            -DskipTests \
            package \
            -f "$MINI_JVM_DIR/minijvm/java/pom.xml"

          test -s \
            "$MINI_JVM_DIR/minijvm/java/target/minijvm_rt.jar"

          cp \
            "$MINI_JVM_DIR/minijvm/java/target/minijvm_rt.jar" \
            J2MEEmulator/Resources/jars/minijvm_rt.jar

          ls -lh \
            J2MEEmulator/Resources/jars/minijvm_rt.jar

      - name: Build J2ME API runtime JAR
        shell: bash
        run: |
          set -e

          test -f \
            J2MEEmulator/Resources/jars/minijvm_rt.jar

          bash j2me_api/build.sh

          test -s \
            J2MEEmulator/Resources/jars/j2me_api.jar

          echo "J2ME runtime JARs:"
          ls -lh \
            J2MEEmulator/Resources/jars/minijvm_rt.jar \
            J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Verify Xcode project
        shell: bash
        run: |
          set -e

          test -d J2MEEmulator.xcodeproj

          xcodebuild \
            -list \
            -project J2MEEmulator.xcodeproj

      - name: Build app for iOS 16.4
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project J2MEEmulator.xcodeproj \
            -scheme J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=16.4 \
            SWIFT_VERSION=5.0 \
            PRODUCT_BUNDLE_IDENTIFIER=com.trantu2641.j2meplayer \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify app and package IPA
        shell: bash
        run: |
          set -e

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JarBox.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: JarBox.app was not found."
            echo "Available app bundles:"
            find "$RUNNER_TEMP/DerivedData" \
              -name '*.app' \
              -type d \
              -print || true
            exit 1
          fi

          MIN_OS=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :MinimumOSVersion' \
              "$APP/Info.plist"
          )

          echo "Built MinimumOSVersion: $MIN_OS"

          if [ "$MIN_OS" != "16.4" ]; then
            echo "ERROR: Expected iOS 16.4, got $MIN_OS"
            exit 1
          fi

          cp \
            J2MEEmulator/Resources/jars/minijvm_rt.jar \
            "$APP/minijvm_rt.jar"

          cp \
            J2MEEmulator/Resources/jars/j2me_api.jar \
            "$APP/j2me_api.jar"

          test -s "$APP/minijvm_rt.jar"
          test -s "$APP/j2me_api.jar"

          mkdir -p Payload

          ditto \
            "$APP" \
            Payload/J2MEPlayer.app

          /usr/bin/zip \
            -qry \
            J2ME-iOS-unsigned.ipa \
            Payload

          test -s J2ME-iOS-unsigned.ipa

          echo "Verifying runtime files in IPA:"

          unzip -Z1 J2ME-iOS-unsigned.ipa \
            | grep -E \
              '^Payload/J2MEPlayer\.app/(minijvm_rt|j2me_api)\.jar$'

          ls -lh J2ME-iOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-iOS-unsigned
          path: J2ME-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-iOS-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
