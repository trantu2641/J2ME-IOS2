name: Build J2ME iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Toolchain
      # ============================================================

      - name: Show Xcode
        run: |
          set -e

          xcodebuild -version
          xcodebuild -showsdks


      # ============================================================
      # 3. Java 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. Verify MiniJVM runtime
      #
      # IMPORTANT:
      # Do NOT rebuild or patch minijvm_rt.jar here.
      #
      # The current crash happens inside MiniJVM itself.
      # ============================================================

      - name: Verify bundled MiniJVM
        run: |
          set -e

          RUNTIME="J2MEEmulator/Resources/jars/minijvm_rt.jar"

          if [ ! -s "$RUNTIME" ]; then
            echo ""
            echo "ERROR: minijvm_rt.jar is missing."
            echo ""
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "MiniJVM runtime"
          echo "========================================"

          ls -lh "$RUNTIME"

          echo ""
          echo "Checking MiniJVM HTTP classes:"

          jar tf "$RUNTIME" | grep \
            -E 'org/mini/net/http/(Protocol|StreamConnectionPool|StreamConnectionElement)\.class'

          echo ""
          echo "MiniJVM runtime OK."


      # ============================================================
      # 5. Build j2me_api.jar
      #
      # Build from current source.
      # Use the EXISTING minijvm_rt.jar.
      # ============================================================

      - name: Build J2ME API
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "Building j2me_api.jar"
          echo "========================================"

          bash j2me_api/build.sh

          API="J2MEEmulator/Resources/jars/j2me_api.jar"

          if [ ! -s "$API" ]; then
            echo ""
            echo "ERROR: j2me_api.jar was not generated."
            exit 1
          fi

          echo ""
          echo "Built:"
          ls -lh "$API"


      # ============================================================
      # 6. CRITICAL runtime verification
      # ============================================================

      - name: Verify MIDletRunner
        run: |
          set -e

          API="J2MEEmulator/Resources/jars/j2me_api.jar"

          echo ""
          echo "========================================"
          echo "Checking MIDletRunner"
          echo "========================================"

          if ! jar tf "$API" | grep -q \
            '^javax/microedition/shell/MIDletRunner\.class$'
          then

            echo ""
            echo "ERROR:"
            echo "MIDletRunner.class is missing from j2me_api.jar"
            echo ""

            echo "Available shell classes:"
            jar tf "$API" | grep \
              '^javax/microedition/shell/' || true

            exit 1
          fi

          echo ""
          echo "OK:"
          echo "javax/microedition/shell/MIDletRunner.class"

          echo ""
          echo "J2ME API class count:"
          jar tf "$API" | wc -l


      # ============================================================
      # 7. Verify required J2ME classes
      # ============================================================

      - name: Verify J2ME classes
        run: |
          set -e

          API="J2MEEmulator/Resources/jars/j2me_api.jar"

          REQUIRED="
          javax/microedition/midlet/MIDlet.class
          javax/microedition/shell/MIDletRunner.class
          javax/microedition/lcdui/Canvas.class
          javax/microedition/lcdui/Display.class
          javax/microedition/lcdui/Image.class
          javax/microedition/io/Connector.class
          javax/microedition/io/HttpConnection.class
          "

          for CLASS in $REQUIRED
          do
            if ! jar tf "$API" | grep -q "^$CLASS$"
            then
              echo ""
              echo "ERROR: Missing class:"
              echo "$CLASS"
              exit 1
            fi
          done

          echo ""
          echo "All required J2ME classes exist."


      # ============================================================
      # 8. Verify source MIDletRunner
      # ============================================================

      - name: Verify MIDletRunner source
        run: |
          set -e

          SRC="j2me_api/src/javax/microedition/shell/MIDletRunner.java"

          if [ ! -f "$SRC" ]; then
            echo "ERROR: MIDletRunner.java not found."
            exit 1
          fi

          echo ""
          echo "MIDletRunner source found:"
          echo "$SRC"

          grep -n \
            "public static void main" \
            "$SRC"

          grep -n \
            "Class.forName" \
            "$SRC"


      # ============================================================
      # 9. Verify Xcode project
      # ============================================================

      - name: Verify Xcode project
        run: |
          set -e

          if [ ! -d "J2MEEmulator.xcodeproj" ]; then
            echo "ERROR: J2MEEmulator.xcodeproj not found."
            exit 1
          fi

          xcodebuild \
            -list \
            -project J2MEEmulator.xcodeproj


      # ============================================================
      # 10. Build iOS 16.4
      # ============================================================

      - name: Build iOS app
        run: |
          set -o pipefail

          xcodebuild \
            -project J2MEEmulator.xcodeproj \
            -scheme J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=16.4 \
            SWIFT_VERSION=5.0 \
            PRODUCT_BUNDLE_IDENTIFIER=com.trantu2641.j2meplayer \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"


      # ============================================================
      # 11. Locate app
      # ============================================================

      - name: Locate built app
        run: |
          set -e

          echo ""
          echo "Searching for built app..."

          find "$RUNNER_TEMP/DerivedData" \
            -name "*.app" \
            -type d \
            -print

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JarBox.app"

          if [ ! -d "$APP" ]; then
            echo ""
            echo "ERROR: JarBox.app not found."
            exit 1
          fi

          echo ""
          echo "APP:"
          echo "$APP"

          ls -lh "$APP"


      # ============================================================
      # 12. Replace bundled runtime files explicitly
      #
      # This guarantees the IPA contains exactly the verified
      # runtime files from this checkout.
      # ============================================================

      - name: Install verified runtime into app
        run: |
          set -e

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JarBox.app"

          cp \
            "J2MEEmulator/Resources/jars/minijvm_rt.jar" \
            "$APP/minijvm_rt.jar"

          cp \
            "J2MEEmulator/Resources/jars/j2me_api.jar" \
            "$APP/j2me_api.jar"

          echo ""
          echo "Runtime files inside app:"

          ls -lh \
            "$APP/minijvm_rt.jar" \
            "$APP/j2me_api.jar"


      # ============================================================
      # 13. Verify files INSIDE .app
      # ============================================================

      - name: Verify runtime inside app
        run: |
          set -e

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JarBox.app"

          API="$APP/j2me_api.jar"

          RUNTIME="$APP/minijvm_rt.jar"

          test -s "$API"
          test -s "$RUNTIME"

          echo ""
          echo "Checking MIDletRunner inside final app..."

          if ! jar tf "$API" | grep -q \
            '^javax/microedition/shell/MIDletRunner\.class$'
          then
            echo ""
            echo "FATAL:"
            echo "Final app does not contain MIDletRunner.class"
            exit 1
          fi

          echo ""
          echo "MIDletRunner verified inside final app."


      # ============================================================
      # 14. Check minimum iOS version
      # ============================================================

      - name: Verify iOS deployment target
        run: |
          set -e

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JarBox.app"

          MIN_OS=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :MinimumOSVersion' \
              "$APP/Info.plist"
          )

          echo ""
          echo "MinimumOSVersion = $MIN_OS"

          if [ "$MIN_OS" != "16.4" ]; then
            echo ""
            echo "ERROR: Expected iOS 16.4"
            exit 1
          fi


      # ============================================================
      # 15. Package IPA
      # ============================================================

      - name: Package IPA
        run: |
          set -e

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JarBox.app"

          rm -rf Payload
          mkdir -p Payload

          ditto \
            "$APP" \
            "Payload/J2MEPlayer.app"

          rm -f J2ME-iOS-unsigned.ipa

          /usr/bin/zip \
            -qry \
            J2ME-iOS-unsigned.ipa \
            Payload

          test -s J2ME-iOS-unsigned.ipa

          echo ""
          echo "IPA:"
          ls -lh J2ME-iOS-unsigned.ipa


      # ============================================================
      # 16. Verify IPA contents
      # ============================================================

      - name: Verify IPA
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "IPA runtime verification"
          echo "========================================"

          unzip -Z1 J2ME-iOS-unsigned.ipa \
            | grep \
              -E '^Payload/J2MEPlayer\.app/(minijvm_rt|j2me_api)\.jar$'

          echo ""
          echo "Checking MIDletRunner inside IPA..."

          TMP_IPA="$RUNNER_TEMP/ipa_check"

          rm -rf "$TMP_IPA"

          mkdir -p "$TMP_IPA"

          unzip -q \
            J2ME-iOS-unsigned.ipa \
            -d "$TMP_IPA"

          API="$TMP_IPA/Payload/J2MEPlayer.app/j2me_api.jar"

          if ! jar tf "$API" | grep -q \
            '^javax/microedition/shell/MIDletRunner\.class$'
          then
            echo ""
            echo "ERROR: MIDletRunner missing from final IPA."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "FINAL RUNTIME CHECK: PASS"
          echo "========================================"


      # ============================================================
      # 17. Upload IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-iOS-unsigned
          path: J2ME-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # 18. Upload build log
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-iOS-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
